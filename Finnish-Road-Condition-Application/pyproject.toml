[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finnish-road-ai"
version = "0.1.0"
description = "AI platform for analysing Finnish road-camera conditions"
requires-python = ">=3.11"

dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "pillow>=10.0",
    "streamlit>=1.30",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]