# Local dev stack for the IPAM Support Agent — mirrors docs/architecture.md section 2.
# Two separate Postgres instances on purpose: "postgres" is the agent's own DB
# (sessions/messages/tool_calls/pending_actions/audit_log); "netbox-postgres" belongs
# to NetBox, the IPAM system of record. Do not merge them — see architecture doc 4.7/9.
#
# Usage: from repo root, `docker compose --env-file .env -f docker/docker-compose.yml up -d`

name: ipam-agent

services:
  # ---- Agent's own database: conversation state + audit trail ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- NetBox: the IPAM backend / system of record (docs/architecture.md 4.6) ----
  netbox-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NETBOX_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NETBOX_POSTGRES_PASSWORD}
      POSTGRES_DB: ${NETBOX_POSTGRES_DB}
    volumes:
      - netbox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NETBOX_POSTGRES_USER} -d ${NETBOX_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  netbox-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - netbox_redisdata:/data

  netbox:
    image: netboxcommunity/netbox:v4.1-3.12
    restart: unless-stopped
    depends_on:
      netbox-postgres:
        condition: service_healthy
      netbox-redis:
        condition: service_started
    environment:
      DB_NAME: ${NETBOX_POSTGRES_DB}
      DB_USER: ${NETBOX_POSTGRES_USER}
      DB_PASSWORD: ${NETBOX_POSTGRES_PASSWORD}
      DB_HOST: netbox-postgres
      REDIS_HOST: netbox-redis
      REDIS_CACHE_HOST: netbox-redis
      SECRET_KEY: ${NETBOX_SECRET_KEY}
      SUPERUSER_NAME: ${NETBOX_SUPERUSER_NAME}
      SUPERUSER_EMAIL: ${NETBOX_SUPERUSER_EMAIL}
      SUPERUSER_PASSWORD: ${NETBOX_SUPERUSER_PASSWORD}
      ALLOWED_HOSTS: "*"
    ports:
      - "8080:8080"
    volumes:
      - netbox_media:/opt/netbox/netbox/media

  # ---- Local LLM (docs/architecture.md 4.4) ----
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment to give the container GPU access (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ---- Agent app: FastAPI gateway + Agent Runtime + Tool Layer ----
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      netbox:
        condition: service_started
      ollama:
        condition: service_started
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NETBOX_URL: http://netbox:8080
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app

  # ---- Monitoring (docs/architecture.md 4.9) ----
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  agent_pgdata:
  netbox_pgdata:
  netbox_redisdata:
  netbox_media:
  ollama_data:
  prometheus_data:
  grafana_data:
